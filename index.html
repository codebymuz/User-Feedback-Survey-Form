<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Feedback Survey</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
        margin: 0;
        padding: 30px 16px;
        line-height: 1.6;
    }

    h1 {
        text-align: center;
        color: #1d4ed8;
        margin-bottom: 10px;
    }

    body > p {
        text-align: center;
        color: #64748b;
        margin-bottom: 25px;
    }

    form {
        max-width: 650px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    fieldset {
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 22px;
    }

    legend {
        font-weight: bold;
        color: #1d4ed8;
        padding: 0 8px;
    }

    label {
        display: inline-block;
        margin-bottom: 6px;
    }

    input:not([type="radio"]):not([type="checkbox"]),
    select,
    textarea {
        width: 100%;
        padding: 12px;
        margin: 5px 0 16px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: 2px solid #93c5fd;
        border-color: #2563eb;
    }

    input[type="radio"],
    input[type="checkbox"] {
        margin-right: 8px;
        accent-color: #2563eb;
    }

    button,
    input[type="submit"] {
        display: block;
        width: 100%;
        background: #2563eb;
        color: white;
        padding: 13px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover,
    input[type="submit"]:hover {
        background: #1d4ed8;
    }

    @media (max-width: 480px) {
        body {
            padding: 15px 10px;
        }

        form {
            padding: 18px;
        }
    }
</style>
</head>

</head>
<body>
    <!-- Page Title -->
    <h1 id="title">User Feedback Survey</h1>

    <!-- Description -->
    <p id="description">We value your input! Please take a few minutes to fill out this survey and help us improve our services.</p>

    <!-- Survey Form -->
    <form id="survey-form">

        <!-- Personal Information Section -->
        <fieldset>
            <legend>Personal Information</legend>

            <!-- Name Input -->
            <label id="name-label" for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" placeholder="John Doe" required>
            <br><br>

            <!-- Email Input -->
            <label id="email-label" for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="john@example.com" required>
            <br><br>

            <!-- Number Input -->
            <label id="number-label" for="number">Age:</label><br>
            <input type="number" id="number" name="age" placeholder="18" min="1" max="120">
        </fieldset>

        <br>

        <!-- Preferences Section -->
        <fieldset>
            <legend>Your Preferences</legend>

            <!-- Dropdown -->
            <label for="dropdown">How did you hear about us?</label><br>
            <select id="dropdown" name="source">
                <option value="">Select an option</option>
                <option value="friend">Friend</option>
                <option value="social">Social Media</option>
                <option value="search">Search Engine</option>
                <option value="other">Other</option>
            </select>
            <br><br>

            <!-- Radio Buttons -->
            <label>Overall Satisfaction:</label><br>
            <input type="radio" id="radio1" name="satisfaction" value="very_satisfied">
            <label for="radio1">Very Satisfied</label><br>
            <input type="radio" id="radio2" name="satisfaction" value="satisfied">
            <label for="radio2">Satisfied</label><br>
            <input type="radio" id="radio3" name="satisfaction" value="neutral">
            <label for="radio3">Neutral</label><br>
            <input type="radio" id="radio4" name="satisfaction" value="dissatisfied">
            <label for="radio4">Dissatisfied</label>
            <br><br>

            <!-- Checkboxes -->
            <label>Features you use (select all that apply):</label><br>
            <input type="checkbox" id="feature1" name="features" value="featureA">
            <label for="feature1">Feature A</label><br>
            <input type="checkbox" id="feature2" name="features" value="featureB">
            <label for="feature2">Feature B</label><br>
            <input type="checkbox" id="feature3" name="features" value="featureC">
            <label for="feature3">Feature C</label>
        </fieldset>

        <br>

        <!-- Additional Comments Section -->
        <fieldset>
            <legend>Additional Feedback</legend>
            <label for="comments">Comments or Suggestions:</label><br>
            <textarea id="comments" name="comments" placeholder="Share any ideas or feedback here" rows="5" cols="40"></textarea>
        </fieldset>

        <br>

        <!-- Submit Button -->
        <button type="submit" id="submit">Submit Survey</button>

    </form>
</body>
</html>
